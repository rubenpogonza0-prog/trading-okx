name: Backtest H1 Trend Breakout

on:
  push:
    branches-ignore: [main]
    paths:
      - "backend/src/backtest/**"
      - "backend/src/trading/h1Breakout.js"
      - "backend/src/trading/indicators.js"
      - ".github/workflows/backtest.yml"
  workflow_dispatch:
    inputs:
      from:
        description: "Start date (YYYY-MM-DD)"
        default: "2023-01-01"
      symbols:
        description: "Comma-separated base coins"
        default: "BTC,ETH,SOL,XRP,DOGE,BNB,ADA,LINK"

permissions:
  contents: write # commits backend/backtest-results/ back to the branch

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run backtest
        working-directory: backend
        run: node src/backtest/backtest.js --from "${{ inputs.from || '2023-01-01' }}" --symbols "${{ inputs.symbols || 'BTC,ETH,SOL,XRP,DOGE,BNB,ADA,LINK' }}"

      - name: Commit results
        run: |
          git config user.name "okx-backtest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add backend/backtest-results
          git diff --cached --quiet && exit 0
          git commit -m "Update backtest results [skip ci]"
          git pull --rebase --autostash
          git push
